name: 编译 OpenWrt ARMv8 Full

on:
  workflow_dispatch:

  # 每天 UTC 01:00
  # 北京/新加坡时间 09:00
  # 与 x86_64 错开，避免两个任务同时启动
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build OpenWrt ARMv8
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. 检出配置仓库
      # ============================================================
      - name: 📥 检出配置仓库
        uses: actions/checkout@v5


      # ============================================================
      # 2. 设置编译时间
      # ============================================================
      - name: 🕒 设置编译时间
        run: |
          echo "BUILD_DATE=$(date '+%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"
          echo "BUILD_DATE_SHORT=$(date '+%Y%m%d')" >> "$GITHUB_ENV"

          echo "当前时间："
          date


      # ============================================================
      # 3. 清理磁盘空间
      # ============================================================
      - name: 🧹 清理磁盘空间
        run: |
          echo "清理之前："
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules

          docker system prune -af || true

          echo "清理之后："
          df -h


      # ============================================================
      # 4. 创建 4GB Swap
      # ============================================================
      - name: 💾 创建 4GB Swap
        run: |
          if swapon --show | grep -q .; then
            echo "系统已经存在 Swap："
            swapon --show
          else
            echo "创建 4GB Swap..."

            sudo fallocate -l 4G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile

            echo "Swap 创建完成："
            swapon --show
          fi

          echo
          free -h


      # ============================================================
      # 5. 安装编译依赖
      # ============================================================
      - name: 📦 安装编译依赖
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-venv \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            time \
            xsltproc \
            swig \
            libelf-dev \
            ccache \
            xz-utils \
            zip \
            zstd

          sudo apt-get clean

          echo
          echo "========================================"
          echo "编译环境"
          echo "========================================"

          echo "GCC:"
          gcc --version | head -n 1

          echo "Clang:"
          clang --version | head -n 1

          echo "Python:"
          python3 --version

          echo "Git:"
          git --version

          echo "========================================"


      # ============================================================
      # 6. 创建工作目录
      # ============================================================
      - name: 📁 创建 OpenWrt 工作目录
        run: |
          sudo mkdir -p /mnt/openwrt
          sudo chown -R "$USER:$USER" /mnt/openwrt

          ls -la /mnt/openwrt


      # ============================================================
      # 7. 复制配置
      # ============================================================
      - name: 📋 复制编译配置
        run: |
          set -e

          rsync -a \
            --exclude='.git/' \
            --exclude='src/' \
            ./ \
            /mnt/openwrt/

          echo "配置文件："
          ls -lah /mnt/openwrt

          if [ ! -f /mnt/openwrt/config.seed.armv8 ]; then
            echo "❌ 找不到 config.seed.armv8"
            exit 1
          fi

          if [ ! -f /mnt/openwrt/diy.sh ]; then
            echo "❌ 找不到 diy.sh"
            exit 1
          fi

          echo
          echo "✅ 找到 config.seed.armv8"
          echo "✅ 找到 diy.sh"


      # ============================================================
      # 8. 获取最新稳定版
      # ============================================================
      - name: 🔎 获取最新稳定版 OpenWrt
        id: openwrt_release
        working-directory: /mnt/openwrt
        run: |
          set -e

          echo "正在查询 OpenWrt 官方最新稳定版本..."

          OPENWRT_TAG=$(curl -fsSL \
            https://api.github.com/repos/openwrt/openwrt/releases/latest \
            | python3 -c '
          import sys
          import json
          data = json.load(sys.stdin)
          print(data["tag_name"])
          ')

          if [ -z "$OPENWRT_TAG" ] || [ "$OPENWRT_TAG" = "null" ]; then
            echo "❌ 无法获取 OpenWrt 最新稳定版本"
            exit 1
          fi

          echo "========================================"
          echo "OpenWrt 最新稳定版本：$OPENWRT_TAG"
          echo "========================================"

          echo "OPENWRT_TAG=$OPENWRT_TAG" >> "$GITHUB_ENV"
          echo "tag=$OPENWRT_TAG" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 9. 克隆 OpenWrt
      # ============================================================
      - name: 🌐 克隆 OpenWrt 最新稳定版
        working-directory: /mnt/openwrt
        run: |
          set -e

          echo "正在克隆 OpenWrt $OPENWRT_TAG ..."

          git clone \
            --depth=1 \
            --branch "$OPENWRT_TAG" \
            https://github.com/openwrt/openwrt.git \
            src

          cd src

          echo
          echo "========================================"
          echo "OpenWrt 源码版本"
          echo "========================================"

          git describe --tags --always

          echo
          echo "Git Commit:"
          git rev-parse HEAD


      # ============================================================
      # 10. 更新官方 feeds
      # ============================================================
      - name: 📡 更新 OpenWrt feeds
        working-directory: /mnt/openwrt/src
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo
          echo "Feeds 更新完成"


      # ============================================================
      # 11. 添加 iStore 软件源
      # ============================================================
      - name: 🛒 添加 iStore 软件源
        working-directory: /mnt/openwrt/src
        run: |
          set -e

          echo "========================================"
          echo "添加 iStore 软件源"
          echo "========================================"

          if ! grep -q 'istore' feeds.conf.default; then
            echo 'src-git istore https://github.com/linkease/istore;main' \
              >> feeds.conf.default
            echo "已写入 istore feed"
          else
            echo "istore feed 已存在，跳过"
          fi

          ./scripts/feeds update istore

          ./scripts/feeds install -d y -p istore luci-app-store

          echo
          echo "========================================"
          echo "iStore 安装完成"
          echo "========================================"

          ls -d package/feeds/istore/luci-app-store 2>/dev/null \
            && echo "✅ luci-app-store 已就位" \
            || echo "⚠️ 未找到 luci-app-store"


      # ============================================================
      # 12. 导入 ARMv8 config
      # ============================================================
      - name: ⚙️ 导入 config.seed.armv8
        working-directory: /mnt/openwrt/src
        run: |
          set -e

          cp /mnt/openwrt/config.seed.armv8 .config

          echo
          echo "========================================"
          echo "config.seed.armv8 已导入"
          echo "========================================"

          wc -l .config


      # ============================================================
      # 13. 执行 DIY
      # ============================================================
      - name: 🛠️ 执行 DIY 配置
        working-directory: /mnt/openwrt
        run: |
          set -e

          chmod +x diy.sh

          echo "========================================"
          echo "开始执行 diy.sh"
          echo "OpenWrt: $OPENWRT_TAG"
          echo "架构: ARMv8"
          echo "========================================"

          ./diy.sh

          echo
          echo "✅ diy.sh 执行完成"


      # ============================================================
      # 14. 写入编译版本信息
      # ============================================================
      - name: 📝 写入编译版本信息
        working-directory: /mnt/openwrt/src
        run: |
          set -e

          echo "OpenWrt版本: $OPENWRT_TAG" > /mnt/openwrt/build-info.txt
          echo "编译时间: $BUILD_DATE" >> /mnt/openwrt/build-info.txt
          echo "架构: ARMv8" >> /mnt/openwrt/build-info.txt
          echo "Target: armsr/armv8" >> /mnt/openwrt/build-info.txt
          echo "Commit: $(git rev-parse HEAD)" >> /mnt/openwrt/build-info.txt

          cat /mnt/openwrt/build-info.txt


      # ============================================================
      # 15. 生成最终配置
      # ============================================================
      - name: ⚙️ 生成最终配置
        working-directory: /mnt/openwrt/src
        run: |
          set -e

          make defconfig

          echo
          echo "========================================"
          echo "最终 .config"
          echo "========================================"

          cp .config /mnt/openwrt/final.config

          wc -l .config


      # ============================================================
      # 16. 下载源码包
      # ============================================================
      - name: 📥 下载源码包
        working-directory: /mnt/openwrt/src
        run: |
          set -e

          make download -j$(nproc) V=s


      # ============================================================
      # 17. 编译 ARMv8
      # ============================================================
      - name: 🔨 编译 OpenWrt ARMv8
        working-directory: /mnt/openwrt/src
        env:
          FORCE_UNSAFE_CONFIGURE: 1
        run: |
          set -o pipefail

          echo "========================================"
          echo "开始编译 OpenWrt"
          echo "版本：$OPENWRT_TAG"
          echo "架构：ARMv8"
          echo "Target：armsr/armv8"
          echo "CPU：$(nproc) 核"
          echo "========================================"

          START_TIME=$(date +%s)

          if make -j$(nproc); then
            echo "✅ 多线程编译成功"
          else
            echo "⚠️ 多线程编译失败"
            echo "开始使用单线程详细日志重新编译"

            make -j1 V=s
          fi

          END_TIME=$(date +%s)
          BUILD_TIME=$((END_TIME - START_TIME))

          echo "========================================"
          echo "编译完成"
          echo "耗时：${BUILD_TIME} 秒"
          echo "========================================"


      # ============================================================
      # 18. 检查 ARMv8 编译结果
      # ============================================================
      - name: 📂 检查编译结果
        working-directory: /mnt/openwrt/src
        run: |
          set -e

          OUTPUT_DIR="bin/targets/armsr/armv8"

          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "❌ 找不到 ARMv8 固件目录"
            exit 1
          fi

          echo
          echo "========================================"
          echo "ARMv8 固件"
          echo "========================================"

          ls -lah "$OUTPUT_DIR"

          echo
          echo "文件数量："
          find "$OUTPUT_DIR" -type f | wc -l


      # ============================================================
      # 19. 整理 ARMv8 固件
      # ============================================================
      - name: 📦 整理完整 ARMv8 固件
        working-directory: /mnt/openwrt/src
        run: |
          set -e

          OUTPUT_DIR="bin/targets/armsr/armv8"
          FINAL_DIR="/mnt/openwrt/output/firmware"

          mkdir -p "$FINAL_DIR"

          cp -a "$OUTPUT_DIR"/. "$FINAL_DIR"/

          cp /mnt/openwrt/final.config \
            "$FINAL_DIR/config"

          cp /mnt/openwrt/build-info.txt \
            "$FINAL_DIR/build-info.txt"

          echo
          echo "========================================"
          echo "最终 ARMv8 固件目录"
          echo "========================================"

          ls -lah "$FINAL_DIR"


      # ============================================================
      # 20. SHA256
      # ============================================================
      - name: 🔐 生成 SHA256 校验
        working-directory: /mnt/openwrt/output/firmware
        run: |
          set -e

          rm -f SHA256SUMS sha256sums

          find . -maxdepth 1 -type f \
            ! -name 'sha256sums' \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum > sha256sums

          cat sha256sums


      # ============================================================
      # 21. 检查大小写冲突
      # ============================================================
      - name: 🔍 发布前检查文件名冲突
        working-directory: /mnt/openwrt/output/firmware
        run: |
          set -e

          DUPES=$(find . -maxdepth 1 -type f -printf '%f\n' \
            | tr '[:upper:]' '[:lower:]' \
            | sort \
            | uniq -d)

          if [ -z "$DUPES" ]; then
            echo "✅ 未发现大小写冲突"
          else
            echo "⚠️ 发现冲突："
            echo "$DUPES"

            for name in $DUPES; do
              MATCHES=$(find . -maxdepth 1 -type f -printf '%f\n' \
                | grep -i "^${name}$" || true)

              KEEP=""

              for f in $MATCHES; do
                if [ "$f" = "$name" ]; then
                  KEEP="$f"
                fi
              done

              if [ -z "$KEEP" ]; then
                KEEP=$(echo "$MATCHES" | head -n 1)
              fi

              for f in $MATCHES; do
                if [ "$f" != "$KEEP" ]; then
                  rm -f "$f"
                fi
              done
            done
          fi

          ls -lah


      # ============================================================
      # 22. 编译结果统计
      # ============================================================
      - name: 📊 编译结果统计
        working-directory: /mnt/openwrt/output/firmware
        run: |
          echo "========================================"
          echo "OpenWrt ARMv8 编译完成"
          echo "========================================"

          echo "版本：$OPENWRT_TAG"
          echo "编译时间：$BUILD_DATE"
          echo "架构：ARMv8"
          echo "Target：armsr/armv8"

          echo
          echo "固件文件："

          find . -maxdepth 1 -type f \
            -printf '%f\t%k KB\n' \
            | sort

          echo
          echo "总大小："
          du -sh .


      # ============================================================
      # 23. Artifact
      # ============================================================
      - name: 📤 上传 ARMv8 完整固件
        uses: actions/upload-artifact@v6
        with:
          name: OpenWrt-ARMv8-${{ env.OPENWRT_TAG }}-${{ env.BUILD_DATE_SHORT }}
          path: /mnt/openwrt/output/firmware/
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 24. GitHub Release
      # ============================================================
      - name: 🚀 发布到 GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: OpenWrt-ARMv8-${{ steps.openwrt_release.outputs.tag }}-${{ env.BUILD_DATE }}
          name: OpenWrt ARMv8 ${{ steps.openwrt_release.outputs.tag }} (${{ env.BUILD_DATE }})
          body: |
            OpenWrt 版本：${{ steps.openwrt_release.outputs.tag }}
            编译时间：${{ env.BUILD_DATE }}
            架构：ARMv8
            Target：armsr/armv8
            仓库：${{ github.repository }}
            Commit：${{ github.sha }}
          files: |
            /mnt/openwrt/output/firmware/*
          overwrite_files: true
          preserve_order: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
